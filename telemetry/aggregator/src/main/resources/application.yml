spring:
  main:
    web-application-type: none
  application:
    name: telemetry-aggregator

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: telemetry-aggregator-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.yandex.practicum.deserialization.SensorEventDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: ru.yandex.practicum.serialization.GeneralAvroSerializer

    topics:
      sensors: "telemetry.sensors.v1"
      snapshots: "telemetry.snapshots.v1"

logging:
  level:
    root: INFO
    ru.yandex.practicum.aggregator: DEBUG